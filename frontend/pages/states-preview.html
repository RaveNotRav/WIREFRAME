<!DOCTYPE html>
<html lang="en" class="preload">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>States Preview - WIREFRAME</title>
    <script>
        // Must stay in sync with initTheme() in frontend/assets/js/lib/theme.js
        (function() {
            try {
                var saved = localStorage.getItem('wireframe-theme');
                if (!saved || saved === 'auto') {
                    saved = (typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                var theme = saved === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
            if (typeof requestAnimationFrame === 'function') {
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        document.documentElement.classList.remove('preload');
                    });
                });
            } else {
                document.documentElement.classList.remove('preload');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/neumorphism.css">
    <link rel="stylesheet" href="/assets/css/bento.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <style>
        body { 
            padding: 20px; 
            background-color: var(--surface-bg);
            font-family: var(--font-family);
            margin: 0;
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        h2, h1 { color: var(--text-primary); margin-top: 40px; margin-bottom: 20px; }
    </style>
</head>
<body class="neu-app">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>State Gallery</h1>
        <button id="theme-toggle" class="neu-button neu-raised-sm" aria-label="Toggle Theme">Toggle Theme</button>
    </div>
    
    <h2>Statuses</h2>
    <div class="grid" id="status-grid"></div>
    
    <h2>Safety Levels</h2>
    <div class="grid" id="safety-grid"></div>

    <script type="module">
        import { initTheme, toggleTheme } from '/assets/js/lib/theme.js';
        import { statusPresentation, safetyPresentation } from '/assets/js/lib/presentation.js';

        initTheme();
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        const statuses = [
            { status: 'queued' },
            { status: 'processing' },
            { status: 'complete', reason: 'Done' },
            { status: 'rejected', reason: 'Blurry' },
            { status: 'no_wires' },
            { status: 'error', reason: 'DB Failed' },
            { status: 'interrupted' }
        ];

        const statusGrid = document.getElementById('status-grid');
        statuses.forEach(s => {
            const pres = statusPresentation(s);
            statusGrid.innerHTML += `
                <div class="bento-tile bento-m neu-raised">
                    <div class="bento-tile-header">
                        <h3 class="bento-tile-title">Status: ${s.status}</h3>
                        <span class="neu-badge" data-risk="${pres.risk}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5"/></svg> ${pres.text}</span>
                    </div>
                    <div class="bento-tile-body">
                        <div style="color: var(--color-error); font-size: 0.9rem;">${pres.reason || ''}</div>
                    </div>
                </div>
            `;
        });

        const safetyLevels = [
            { name: 'Safe', data: { safety_level: 'Safe', crs: 0.1, crs_band: 'Low', clearance_status: 'ok', safety_reasons: ['All good'] } },
            { name: 'Caution', data: { safety_level: 'Caution', crs: 0.4, crs_band: 'Moderate', clearance_status: 'ok', safety_reasons: ['Caution'] } },
            { name: 'Unsafe', data: { safety_level: 'Unsafe', crs: 0.7, crs_band: 'High', clearance_status: 'ok', safety_reasons: ['Unsafe'] } },
            { name: 'Critical', data: { safety_level: 'Critical', crs: 0.9, crs_band: 'Critical', clearance_status: 'ok', safety_reasons: ['Critical'] } },
            { name: 'Unknown', data: { safety_level: 'Unknown', crs_band: 'unavailable', safety_reasons: [] } },
            { name: 'clearance unavailable', data: { safety_level: 'Caution', crs: 0.5, crs_band: 'Moderate', clearance_status: 'unavailable', basis: 'crs_only', safety_reasons: [] } },
            { name: 'CRS unavailable', data: { safety_level: 'Unknown', crs_band: 'unavailable', safety_reasons: [] } },
            { name: 'basis=crs_only', data: { safety_level: 'Caution', crs: 0.5, crs_band: 'Moderate', clearance_status: 'unavailable', basis: 'crs_only', safety_reasons: [] } }
        ];

        const safetyGrid = document.getElementById('safety-grid');
        safetyLevels.forEach(s => {
            const pres = safetyPresentation(s.data);
            const reasonsHtml = pres.reasons.map(r => `<li>${r}</li>`).join('');
            safetyGrid.innerHTML += `
                <div class="bento-tile bento-m neu-raised">
                    <div class="bento-tile-header">
                        <h3 class="bento-tile-title">${s.name}</h3>
                    </div>
                    <div class="bento-tile-body" style="align-items: center;">
                        <div class="neu-badge" data-risk="${pres.risk}" style="font-size: 1.5rem; padding: 12px 24px;"><svg width="14" height="14" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5"/></svg> ${pres.text}</div>
                        <ul style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 16px; padding-left: 20px;">
                            ${reasonsHtml}
                        </ul>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
